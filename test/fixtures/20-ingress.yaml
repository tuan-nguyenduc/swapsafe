# Four routes, three of which are translated wrong on purpose. The fourth is
# the negative case: a correct translation must produce no findings at all,
# which is the half of the end-to-end suite that catches false positives.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ok
  namespace: swapsafe-e2e
spec:
  ingressClassName: nginx
  rules:
    - host: ok.e2e.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
---
# No HTTPRoute exists for this one at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing
  namespace: swapsafe-e2e
spec:
  ingressClassName: nginx
  rules:
    - host: missing.e2e.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
---
# nginx redirects every plain HTTP request; the HTTPRoute does not.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect
  namespace: swapsafe-e2e
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: redirect.e2e.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
---
# nginx rewrites /api/... to /; the HTTPRoute passes the path through.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite
  namespace: swapsafe-e2e
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: rewrite.e2e.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
---
# The prefix-strip idiom, translated correctly. It was reported as having no
# HTTPRoute at all until v0.1.2, because pairing compared paths as strings.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prefix
  namespace: swapsafe-e2e
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: prefix.e2e.test
      http:
        paths:
          - path: /podinfo(/|$)(.*)
            pathType: ImplementationSpecific
            backend: {service: {name: backend, port: {number: 80}}}
---
# A route whose body carries a request id, so the two sides can never hash the
# same. Nothing is wrong with it, and swapsafe has to say so.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unstable
  namespace: swapsafe-e2e
spec:
  ingressClassName: nginx
  rules:
    - host: unstable.e2e.test
      http:
        paths:
          - path: /unstable
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 80}}}
