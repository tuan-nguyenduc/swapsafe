version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gocritic
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        # PLAN section 4: model is a leaf package.
        model:
          files: ["**/internal/model/**"]
          deny:
            - pkg: github.com/tuan-nguyenduc/swapsafe/internal
              desc: internal/model must not import other internal packages
        # PLAN section 4: generator and differ only see model and pkg/rule.
        pipeline:
          files: ["**/internal/generator/**", "**/internal/differ/**"]
          allow:
            - $gostd
            - github.com/tuan-nguyenduc/swapsafe/internal/model
            - github.com/tuan-nguyenduc/swapsafe/pkg
        # PLAN section 4: rules stay extractable into their own module.
        rules:
          files: ["**/rules/**"]
          allow:
            - $gostd
            - github.com/tuan-nguyenduc/swapsafe/pkg
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]

formatters:
  enable:
    - gofmt
