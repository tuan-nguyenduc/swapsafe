version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gocritic
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        # PLAN section 4: the public packages are a leaf. Rules and the Rule
        # interface live here, so nothing under internal/ may leak into them.
        public:
          files: ["**/pkg/**", "**/rules/**"]
          deny:
            - pkg: github.com/tuan-nguyenduc/swapsafe/internal
              desc: pkg/ and rules/ must not import internal/ (see ADR-0002)
        # PLAN section 4: generator and differ only see the core types and rules.
        pipeline:
          files: ["**/internal/generator/**", "**/internal/differ/**"]
          allow:
            - $gostd
            - github.com/tuan-nguyenduc/swapsafe/pkg
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]

formatters:
  enable:
    - gofmt
