# Three routes, one of each outcome swapsafe can report.
#
#   ok     translated correctly        -> nothing to say
#   admin  no HTTPRoute at all         -> critical, the traffic has nowhere to go
#   shop   ssl-redirect was dropped    -> critical, nginx redirects and the Gateway does not
#   live   body changes every request  -> info, there is nothing to compare
#   prefix the prefix-strip idiom       -> paired and silent, despite the regex path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ok, namespace: shop}
spec:
  ingressClassName: nginx
  rules:
    - host: ok.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: admin, namespace: shop}
spec:
  ingressClassName: nginx
  rules:
    - host: admin.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: admin, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: live, namespace: shop}
spec:
  ingressClassName: nginx
  rules:
    - host: live.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: live, port: {number: 80}}}
---
# The most common ingress-nginx configuration there is: a regex path and a
# rewrite that strips the prefix. The HTTPRoute spells it a completely
# different way, and the two still have to pair.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prefix
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: prefix.test
      http:
        paths:
          - path: /podinfo(/|$)(.*)
            pathType: ImplementationSpecific
            backend: {service: {name: web, port: {number: 80}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: prefix, namespace: shop}
spec:
  parentRefs: [{name: gateway}]
  hostnames: [prefix.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /podinfo}}]
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs: [{name: web, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: live, namespace: shop}
spec:
  parentRefs: [{name: gateway}]
  hostnames: [live.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: live, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: ok, namespace: shop}
spec:
  parentRefs: [{name: gateway}]
  hostnames: [ok.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: web, port: 80}]
---
# Translated, but the RequestRedirect filter that reproduces ssl-redirect is missing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop, namespace: shop}
spec:
  parentRefs: [{name: gateway}]
  hostnames: [shop.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: web, port: 80}]
