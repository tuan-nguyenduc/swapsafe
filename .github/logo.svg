<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="swapsafe">
  <title>swapsafe</title>
  <!-- An s, drawn as two routes that mirror each other and meet in the middle.
       The second stroke is the first rotated 180 degrees about the centre, so
       the symmetry is exact rather than eyeballed — which is the verdict
       swapsafe exists to give. -->
  <defs>
    <path id="swapsafe-route" d="M47 19 C47 9 17 9 17 22 C17 31 32 32 32 32"
          fill="none" stroke-width="9" stroke-linecap="round"/>
  </defs>
  <use href="#swapsafe-route" stroke="#0F766E"/>
  <use href="#swapsafe-route" stroke="#2DD4BF" transform="rotate(180 32 32)"/>
</svg>
