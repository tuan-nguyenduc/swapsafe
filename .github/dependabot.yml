version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Matches the 14-day rule we apply to pinned actions (PLAN 6.3).
    # Security updates bypass the cooldown.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Matches the 14-day rule we apply to pinned actions (PLAN 6.3).
    # Security updates bypass the cooldown.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
